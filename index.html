<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Fireworks Generator</title>
    <style>
        /* Use a custom dark theme for the fireworks display */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d0d1a; /* Very dark blue/purple night sky */
            font-family: 'Inter', sans-serif;
            cursor: crosshair;
        }

        canvas {
            display: block;
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            font-size: 14px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
            user-select: none;
            /* Simple layout for the single instruction */
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 90%;
            width: auto;
        }

        #controls p {
            margin: 0;
            font-weight: 500;
        }
    </style>
    <!-- Firebase SDKs are no longer needed, but kept for Canvas environment compatibility -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <canvas id="fireworksCanvas"></canvas>
    <div id="controls">
        <p>Click or tap anywhere to launch a new firework!</p>
    </div>

    <script>
        // Set up the canvas and context
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // --- Firebase Setup (Kept for environment compatibility, but functionality removed) ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        let userId = crypto.randomUUID(); // Default UUID since auth is skipped

        function initFirebase() {
             // In a standalone file, we skip auth entirely. 
             // We just ensure the userId is set.
             console.log("Skipping Firebase initialization as requested.");
        }
        
        // --- Game State (Static Configuration) ---

        // Global state for fireworks and particles
        const fireworks = [];
        const particles = [];
        
        // STATIC PHYSICS AND COLORS (These were previously set by the API)
        const currentGravity = 0.04; // Gravity magnitude
        const explosionIntensity = 1.0; // Multiplier for particle count
        const currentColors = [
            '#FFD700', '#FF4500', '#ADFF2F', '#00FFFF', '#FF69B4', '#1E90FF', '#9370DB', '#FFA07A' // Bright, default colors
        ];

        // --- Utility Functions ---

        /**
         * Get a random number between min (inclusive) and max (inclusive)
         */
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        /**
         * Get a random element from an array
         */
        function randomChoice(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }
        
        // --- Particle Class (The Explosion Sparks) ---

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.angle = random(0, Math.PI * 2);
                this.speed = random(1, 10);
                this.friction = 0.95;
                this.velocity = {
                    x: Math.cos(this.angle) * this.speed * random(0.5, 1.5),
                    y: Math.sin(this.angle) * this.speed * random(0.5, 1.5)
                };
                this.alpha = 1; // opacity
                this.decay = random(0.015, 0.03); // speed of fading
                this.size = random(1, 3);
            }

            update() {
                // Apply friction
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;

                // Apply dynamic gravity
                this.velocity.y += currentGravity * 2; // Stronger gravity for particles

                // Update position
                this.x += this.velocity.x;
                this.y += this.velocity.y;

                // Fade out
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        // --- Firework Class (The Rocket Launch) ---

        class Firework {
            constructor(startX, startY, targetX, targetY) {
                this.x = startX;
                this.y = startY;
                this.startX = startX;
                this.startY = startY;
                this.targetX = targetX;
                this.targetY = targetY;

                // Calculate distance
                const dx = targetX - startX;
                const dy = targetY - startY;
                this.distance = Math.sqrt(dx * dx + dy * dy);
                this.distanceTraveled = 0;

                // Calculate speed and velocity
                this.speed = random(5, 8);
                this.angle = Math.atan2(dy, dx);
                this.velocity = {
                    x: Math.cos(this.angle) * this.speed,
                    y: Math.sin(this.angle) * this.speed
                };

                // Use the globally set colors
                this.color = randomChoice(currentColors);
                this.trailParticles = [];
                this.exploded = false;
            }

            update() {
                if (this.exploded) return;

                // Calculate the distance traveled since the last update
                const previousX = this.x;
                const previousY = this.y;

                // Update velocity with dynamic gravity
                this.velocity.y += currentGravity;

                // Update position
                this.x += this.velocity.x;
                this.y += this.velocity.y;

                // Calculate new distance traveled
                const distanceToTarget = Math.sqrt(
                    Math.pow(this.x - this.startX, 2) +
                    Math.pow(this.y - this.startY, 2)
                );

                // Check for explosion criteria: past the target or going downwards heavily
                const shouldExplode = distanceToTarget >= this.distance || this.velocity.y > 0.5;

                if (shouldExplode) {
                    this.explode();
                } else {
                    // Create a small trail particle
                    this.trailParticles.push(new Particle(previousX, previousY, 'rgba(255, 255, 255, 0.5)'));
                    // Keep the trail particles count low for performance
                    if (this.trailParticles.length > 5) {
                        this.trailParticles.shift();
                    }
                }
            }

            draw() {
                if (this.exploded) return;

                // Draw trail particles
                this.trailParticles.forEach((p, i) => {
                    p.alpha = i / this.trailParticles.length * 0.5; // Fading trail
                    p.draw();
                });

                // Draw the main rocket dot
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            explode() {
                this.exploded = true;
                // Scale particle count by explosionIntensity
                const particleCount = random(80 * explosionIntensity, 150 * explosionIntensity);

                // Create a burst of particles
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle(this.x, this.y, this.color));
                }
            }
        }

        // --- Main Animation and Event Loop ---

        /**
         * Clears the canvas and draws the objects.
         */
        function draw() {
            // Apply a fade effect instead of full clear to create trails
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(13, 13, 26, 0.1)'; // Slow fade
            ctx.fillRect(0, 0, width, height);
            ctx.globalCompositeOperation = 'lighter'; // Additive blending for brighter colors

            // Draw fireworks (rockets)
            fireworks.forEach(firework => firework.draw());

            // Draw particles (explosion sparks)
            particles.forEach(particle => particle.draw());
        }

        /**
         * Updates the state of all fireworks and particles.
         */
        function update() {
            // Update fireworks and clean up exploded ones
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const firework = fireworks[i];
                firework.update();
                if (firework.exploded) {
                    // Remove the exploded firework after its particles are generated
                    fireworks.splice(i, 1);
                }
            }

            // Update particles and clean up faded ones
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.update();
                if (particle.alpha <= particle.decay) {
                    // Remove faded particle
                    particles.splice(i, 1);
                }
            }
        }

        /**
         * Main animation loop
         */
        function loop() {
            requestAnimationFrame(loop);
            update();
            draw();
        }

        /**
         * Launches a firework from the bottom center towards the click/tap coordinates.
         * @param {number} x
         * @param {number} y
         */
        function launchFirework(x, y) {
            // Launch from the bottom center
            const startX = width / 2;
            const startY = height;
            fireworks.push(new Firework(startX, startY, x, y));
        }

        // --- Event Listeners and Initialization ---

        // Handle window resizing
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        });

        // Handle mouse clicks
        canvas.addEventListener('click', (e) => {
            launchFirework(e.clientX, e.clientY);
        });

        // Handle touch taps (for mobile)
        canvas.addEventListener('touchstart', (e) => {
            // Prevent scrolling on touch
            e.preventDefault();
            const touch = e.touches[0];
            launchFirework(touch.clientX, touch.clientY);
        });
        
        // Initial setup on window load
        window.onload = function() {
            initFirebase();
            
            // Initial launch of a few fireworks to start the show
            launchFirework(width / 4, height / 4);
            launchFirework(width / 2, height / 3);
            launchFirework(width * 3 / 4, height / 4);
            loop(); // Start the animation loop
        };
    </script>
</body>
</html>
